package:
  name: daft-lib
  version: 0.0.1

source:
  path: ..

build:
  number: 0
  script:
    # Build with Ninja: conda-build's default Visual Studio generator does not know
    # Visual Studio 2026, and the vs2026 activation sets platform/toolset variables
    # that only apply to Visual Studio generators.
    - set "CMAKE_GENERATOR=Ninja"                  # [win]
    - set "CMAKE_GENERATOR_PLATFORM="              # [win]
    - set "CMAKE_GENERATOR_TOOLSET="               # [win]
    - export CMAKE_GENERATOR=Ninja                 # [not win]
    - "{{ PYTHON }} -m pip install . -vv"

requirements:
  build:
    - python
    - {{ compiler('cxx') }}

  host:
    - python
    - pip
    - scikit-build-core
    - ninja
    - pybind11 >=2.10.0

  run:
    - python


test:
  imports:
    - daft_lib
  requires:
    - pytest
  source_files:
    - tests
  commands:
    - pytest tests

about:
  summary: An example project built with litgen, pybind11, and scikit-build.
  license_file: LICENSE
